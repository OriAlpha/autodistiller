name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the release workflow gate publishing on this exact job.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # CI has no GPU, so the CPU torch build keeps the download small. The
      # test suite runs entirely on CPU against a tiny in-process model.
      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}
        env:
          UV_TORCH_BACKEND: cpu

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -m "not slow and not gpu"
