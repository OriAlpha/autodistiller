[project]
name = "autodistiller"
version = "1.2.0"
description = "Automatically find the best LLM deployment configuration for your hardware and quality constraints."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Suhas Goravale Siddaramu", email = "41699212+OriAlpha@users.noreply.github.com" }]
maintainers = [{ name = "Suhas", email = "41699212+OriAlpha@users.noreply.github.com" }]
keywords = ["llm", "quantization", "evaluation", "vllm", "deployment", "optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "torch>=2.7",
    "transformers>=4.44",
    "tokenizers>=0.19",
    "safetensors>=0.4",
    "huggingface-hub>=0.24",
    "datasets>=2.20",
    "accelerate>=0.33",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "nvidia-ml-py>=12.535; sys_platform != 'darwin'",
    "httpx>=0.28.1",
    "compressed-tensors>=0.17.0",
    "gguf>=0.10",
    # Image tasks only, and both are load-bearing rather than convenience:
    # `datasets` decodes an image column through PIL, and Transformers v5
    # dropped the PIL-based image processors, so `AutoImageProcessor` resizes
    # and normalizes through torchvision or not at all. Small wheels next to
    # torch, which ships the CUDA libraries they link against.
    "pillow>=10.0",
    "torchvision>=0.18",
]

[project.optional-dependencies]
# Phase 2+ pulls these in; kept optional so Phase 1 stays installable everywhere.
vllm = ["vllm>=0.6"]

[project.scripts]
autodistiller = "autodistiller.cli:main"

[project.urls]
Homepage = "https://github.com/OriAlpha/Autodistiller"
Repository = "https://github.com/OriAlpha/Autodistiller"
Issues = "https://github.com/OriAlpha/Autodistiller/issues"
Changelog = "https://github.com/OriAlpha/Autodistiller/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autodistiller"]

# --- uv -----------------------------------------------------------------
# torch on PyPI ships CPU-only wheels for Windows, and AutoDistiller targets
# NVIDIA GPUs first (incl. Blackwell / sm_120, which needs CUDA 12.8+).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.uv]
default-groups = ["dev"]

# --- tooling ------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # typer uses function calls in argument defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: requires downloading a model or dataset (deselect with '-m \"not slow\"')",
    "gpu: requires an available CUDA device",
]

[tool.mypy]
python_version = "3.10"
packages = ["autodistiller"]
mypy_path = "src"
ignore_missing_imports = true
